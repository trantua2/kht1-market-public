<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KHT1 Market · Sạp hàng</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">KIẾM HIỆP TÌNH 1 · SABO</p>
        <h1>Sạp hàng KHT1</h1>
        <p class="subtitle">Danh sách vật phẩm đang bán ở các sạp. Dữ liệu cập nhật theo từng lượt quét.</p>
      </div>
      <div id="status" class="status"><span class="dot"></span><span>Đang tải dữ liệu…</span></div>
    </header>

    <section class="market panel">
      <div class="market-head">
        <div>
          <h2>Dữ liệu mới nhất của ba thành</h2>
          <p id="market-summary" class="hint">Đang tải dữ liệu…</p>
        </div>
      </div>
      <div class="filter-grid">
        <label>Tên món<input id="filter-query" type="search" placeholder="Toàn Thạch, Giới Chỉ…" autocomplete="off"></label>
        <label>Loại trang sức<select id="filter-item-type"><option value="">Tất cả loại</option><option value="ring">Nhẫn</option><option value="necklace">Hạng liên</option><option value="pendant">Ngọc bội</option><option value="charm">Hộ thân phù</option><option value="sachet">Hương nang</option></select></label>
        <label>Hệ<select id="filter-element"><option value="">Tất cả hệ</option><option>Kim</option><option>Mộc</option><option>Thủy</option><option>Hỏa</option><option>Thổ</option><option value="__unknown__">Chưa rõ hệ</option></select></label>
        <label>Option<select id="filter-option"><option value="">Tất cả option</option></select></label>
        <label>Từ<input id="filter-min" type="number" placeholder="Không giới hạn"></label>
        <label>Đến<input id="filter-max" type="number" placeholder="Không giới hạn"></label>
        <label>Giá tối đa<span class="price-filter-control"><input id="filter-price-max" type="number" min="0" step="1" placeholder="Không giới hạn"><select id="filter-price-currency" aria-label="Đơn vị giá"><option value="coin">Xu</option><option value="silver">Bạc</option></select></span></label>
        <button id="filter-reset" class="secondary">Reset bộ lọc</button>
      </div>
      <div class="section-title">
        <h2>Danh sách theo sạp</h2>
        <span id="count">0 sạp · 0 món</span>
      </div>
      <div id="empty" class="empty">Chưa có dữ liệu quét.</div>
      <div id="shop-groups" class="shop-groups"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="market-view.js"></script>
  <script src="public.js"></script>
</body>
</html>
